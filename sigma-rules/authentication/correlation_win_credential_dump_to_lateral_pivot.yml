title: "Correlation: Credential Dumping Preceding Remote Share Lateral Movement"
id: 7b4581c2-d581-4986-b697-1ae7c04a9dcd
status: test
description: |
    Correlates a local credential harvesting event (such as suspicious memory handle access to lsass.exe via Sysmon EID 10
    or Pass-the-Hash LogonType 9 in Event ID 4624) with subsequent remote administrative share access (Event ID 5145 targeting ADMIN$ or C$)
    originating from the same source host within 300 seconds (5 minutes). This correlation models the quintessential post-exploitation
    sequence: harvesting credentials from memory followed by lateral movement across the enterprise network.
author: Cyberion Defense Labs
date: 2026/09/16
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://attack.mitre.org/techniques/T1021/002/
    - https://attack.mitre.org/techniques/T1550/002/
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
tags:
    - attack.credential_access
    - attack.lateral_movement
    - attack.t1003.001
    - attack.t1021.002
    - attack.t1550.002
correlation:
    type: temporal
    rules:
        - d5f41248-645d-49da-a048-6f1b6f0f0496  # LSASS access
        - 38301c3f-4ba5-4217-9339-c27ff47e3944  # PTH LogonType 9
        - 833d9d64-5164-42f3-879b-b7b5e8e135cf  # Remote share write
    group-by:
        - ComputerName
        - SubjectUserName
    timespan: 300s
    ordered: true
detection:
    event1_credential_access:
        - EventID: 10
          TargetImage|endswith: '\lsass.exe'
        - EventID: 4624
          LogonType: 9
    event2_lateral_movement:
        EventID: 5145
        ShareName|endswith:
            - '\ADMIN$'
            - '\C$'
        AccessMask|contains: '0x2'
    condition: event1_credential_access followed by event2_lateral_movement within 300s
falsepositives:
    - Vulnerability management scanners or automated domain administration scripts performing credential checks and network inventory consecutively.
level: critical
fields:
    - ComputerName
    - SubjectUserName
    - TargetImage
    - ShareName
    - RelativeTargetName
    - IpAddress
# Severity Rationale:
# The combination of endpoint credential harvesting followed shortly by administrative share manipulation across the network
# demonstrates active adversary breakout and lateral proliferation across network segments.
