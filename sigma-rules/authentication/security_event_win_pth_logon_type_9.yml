title: Explicit Credential Logon with NewCredentials via Pass-the-Hash
id: 38301c3f-4ba5-4217-9339-c27ff47e3944
status: test
description: |
    Detects Windows Event ID 4624 with LogonType 9 (NewCredentials) combined with the Advapi authentication package
    or seclogo process. Offensive tools such as Mimikatz (sekurlsa::pth) use this logon type to spawn processes
    with local credentials while substituting stolen NTLM hashes or Kerberos credentials for outbound network authentication.
author: Cyberion Defense Labs
date: 2026/09/16
references:
    - https://attack.mitre.org/techniques/T1550/002/
    - https://attack.mitre.org/techniques/T1078/
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
tags:
    - attack.lateral_movement
    - attack.defense_evasion
    - attack.t1550.002
    - attack.t1078
logsource:
    product: windows
    service: security
detection:
    selection_logon:
        EventID: 4624
        LogonType: 9
    selection_process:
        LogonProcessName|contains:
            - 'Advapi'
            - 'seclogo'
    selection_package:
        AuthenticationPackageName|contains:
            - 'Negotiate'
            - 'NTLM'
    condition: selection_logon and selection_process and selection_package
falsepositives:
    - Legitimate use of the Windows 'runas /netonly' command by systems administrators to manage remote domain assets from non-domain joined workstations.
level: high
fields:
    - EventID
    - LogonType
    - TargetUserName
    - TargetDomainName
    - SubjectUserName
    - LogonProcessName
    - AuthenticationPackageName
# Severity Rationale:
# LogonType 9 is rare in standard end-user activity. When paired with administrative target users, it strongly suggests
# an in-memory Pass-the-Hash or Overpass-the-Hash operation attempting lateral pivot without knowing the plaintext password.
