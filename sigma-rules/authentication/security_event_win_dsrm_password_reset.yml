title: Directory Services Restore Mode Admin Password Reset Attempt
id: 01753072-e2ec-4d43-a3f8-1edf1ab511f0
status: test
description: |
    Detects Windows Event ID 4794, indicating an attempt to reset the Directory Services Restore Mode (DSRM)
    administrator account password on a domain controller. Adversaries who have achieved administrative control
    reset the DSRM password and configure DSRM logon behavior (via registry key DsrmAdminLogonBehavior) to establish
    a stealthy, persistent backdoor account on domain controllers that survives Active Directory account audits.
author: Cyberion Defense Labs
date: 2026/09/16
references:
    - https://attack.mitre.org/techniques/T1098/
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
tags:
    - attack.persistence
    - attack.credential_access
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4794
    condition: selection
falsepositives:
    - Legitimate Disaster Recovery maintenance or authorized forest recovery preparation by Enterprise Domain Administrators.
level: high
fields:
    - EventID
    - SubjectUserName
    - SubjectDomainName
    - SubjectUserSid
    - TimeCreated
# Severity Rationale:
# DSRM password modifications occur extremely infrequently in standard production operations (often only during initial
# DC provisioning or disaster drills). An unexpected reset is a high-confidence signal of domain persistence tampering.
