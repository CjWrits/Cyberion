title: C# Compiler Invoked by PowerShell for On-The-Fly Compilation
id: ab9c4e58-f323-4524-b02c-44d8ef3d6e02
status: test
description: |
    Detects the C# command-line compiler (csc.exe) being spawned directly as a child process of PowerShell or cmd.exe.
    Attackers use on-the-fly C# compilation via Add-Type in PowerShell or direct invocations to compile offensive
    assemblies, in-memory injectors, and custom bypass code directly on the target host to evade file-based AV signatures.
author: Cyberion Defense Labs
date: 2026/09/16
references:
    - https://attack.mitre.org/techniques/T1027/004/
    - https://attack.mitre.org/techniques/T1059/001/
tags:
    - attack.defense_evasion
    - attack.execution
    - attack.t1027.004
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
    selection_compiler:
        Image|endswith:
            - '\csc.exe'
            - '\vbc.exe'
            - '\jsc.exe'
    selection_cmd:
        CommandLine|contains:
            - '/noconfig'
            - '/fullpaths'
            - '.cs'
    condition: selection_parent and selection_compiler and selection_cmd
falsepositives:
    - Software developers compiling code locally or build scripts running in developer environments.
level: medium
fields:
    - CommandLine
    - Image
    - ParentImage
    - ParentCommandLine
    - User
# Severity Rationale:
# While developers compile code legitimately, interactive execution of csc.exe from PowerShell on standard employee
# endpoints indicates payload compilation after delivery (T1027.004) to circumvent static antivirus controls.
