title: PowerShell Steganographic Payload Extraction via System.Drawing.Bitmap
id: d14d6b0c-8349-44c8-a5f8-2fc89299cb9e
status: test
description: |
    Detects PowerShell execution patterns involving the instantiation of System.Drawing.Bitmap or System.Drawing
    assemblies combined with pixel manipulation or payload extraction logic. Adversaries employ steganography
    to embed shellcode or secondary scripts into innocent image files (e.g., PNG, BMP) to evade perimeter
    inspection and static endpoint detection.
author: Cyberion Defense Labs
date: 2026/09/16
references:
    - https://attack.mitre.org/techniques/T1027/003/
    - https://attack.mitre.org/techniques/T1059/001/
tags:
    - attack.defense_evasion
    - attack.execution
    - attack.t1027.003
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_ps:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_drawing:
        CommandLine|contains:
            - 'System.Drawing'
            - 'Drawing.Bitmap'
    selection_artifacts:
        CommandLine|contains:
            - '.GetPixel('
            - 'FromHbitmap'
            - 'LockBits'
            - '.Bitmap('
            - 'Add-Type -AssemblyName'
    condition: selection_ps and selection_drawing and selection_artifacts
falsepositives:
    - Custom administrative GUI scripts or automated screenshotting tools authored in PowerShell.
level: high
fields:
    - CommandLine
    - Image
    - ParentImage
    - User
# Severity Rationale:
# Script-driven pixel extraction by PowerShell is almost exclusively associated with steganographic payload delivery
# in enterprise workstations. Benign administrative workflows rarely unpack byte arrays from image pixels.
