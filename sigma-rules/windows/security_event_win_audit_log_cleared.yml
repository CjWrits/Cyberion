title: Windows Security or System Audit Log Cleared
id: cacaf252-f706-446a-8b88-0516e962cfb4
status: test
description: |
    Detects the clearing of Windows Security (Event ID 1102) or System (Event ID 104) event logs.
    Adversaries clear audit logs using wevtutil.exe, PowerShell (Clear-EventLog), or API calls during post-exploitation
    to destroy forensic evidence, blind security operations center analysts, and evade automated detection rules.
author: Cyberion Defense Labs
date: 2026/09/16
references:
    - https://attack.mitre.org/techniques/T1070/001/
    - https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
tags:
    - attack.defense_evasion
    - attack.t1070.001
logsource:
    product: windows
    service: security
detection:
    selection_security_clear:
        EventID: 1102
    selection_system_clear:
        EventID: 104
        Provider_Name: 'Microsoft-Windows-Eventlog'
    condition: selection_security_clear or selection_system_clear
falsepositives:
    - Manual administrative maintenance or system image preparation scripts, which should always be performed under change-control windows.
level: high
fields:
    - EventID
    - SubjectUserName
    - SubjectDomainName
    - SubjectUserSid
    - TimeCreated
# Severity Rationale:
# Security audit log clearing is inherently destructive and represents an active attempt to blind the SOC.
# There is virtually no routine automated business justification for wiping operating system audit logs in production.
